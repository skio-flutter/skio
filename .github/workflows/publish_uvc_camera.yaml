name: publish uvc_camera

# pub.dev automated publishing settings for uvc_camera must be:
#   repository:  skio-flutter/skio
#   tag pattern: uvc_camera-v{{version}}
#   environment: pub.dev (required)
on:
  push:
    tags:
      - 'uvc_camera-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write # OIDC token for pub.dev; no stored credentials.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
      working-directory: packages/uvc_camera
