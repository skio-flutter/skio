name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; no job here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for private files and secrets
        run: tool/check_private_files.sh --all

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: |
          for pkg in packages/*/; do
            echo "::group::test $pkg"
            if grep -q 'sdk: flutter' "$pkg/pubspec.yaml"; then
              (cd "$pkg" && flutter test)
            else
              (cd "$pkg" && dart test)
            fi
            echo "::endgroup::"
          done

      - name: Build serial example (web)
        working-directory: packages/skio_usb_serial/example
        run: flutter build web --release

      - name: Build serial example (Android release)
        working-directory: packages/skio_usb_serial/example
        run: flutter build apk --release

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build UART example (Linux)
        working-directory: packages/skio_uart/example
        run: flutter build linux --release

      - name: Build UART example (Android release)
        working-directory: packages/skio_uart/example
        run: flutter build apk --release

      - name: Build camera example (web)
        working-directory: packages/skio_uvc_camera/example
        run: flutter build web --release

      - name: Build camera example (Android release)
        working-directory: packages/skio_uvc_camera/example
        run: flutter build apk --release

      - name: Publish dry-run
        run: |
          for pkg in packages/*/; do
            echo "::group::dry-run $pkg"
            (cd "$pkg" && flutter pub publish --dry-run)
            echo "::endgroup::"
          done

  # The macOS serial backends are tested against pseudo-terminals, which
  # need a Mac. (The Linux ones run in the ci job above.)
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Test serial (macOS)
        working-directory: packages/skio_usb_serial
        run: flutter test

      - name: Build serial example (macOS)
        working-directory: packages/skio_usb_serial/example
        run: flutter build macos --debug

      - name: Test UART (macOS)
        working-directory: packages/skio_uart
        run: dart test

      - name: Build UART example (macOS)
        working-directory: packages/skio_uart/example
        run: flutter build macos --debug

  # skio_uart's Windows backend: unit tests and a build of the example.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Test serial (Windows)
        working-directory: packages/skio_usb_serial
        run: flutter test

      - name: Build serial example (Windows)
        working-directory: packages/skio_usb_serial/example
        run: flutter build windows --debug

      - name: Test UART (Windows)
        working-directory: packages/skio_uart
        run: dart test

      - name: Build UART example (Windows)
        working-directory: packages/skio_uart/example
        run: flutter build windows --debug
