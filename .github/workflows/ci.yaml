name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; no job here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, analysis, tests and publish dry-runs for every package.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for private files and secrets
        run: tool/check_private_files.sh --all

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: |
          for pkg in packages/*/; do
            echo "::group::test $pkg"
            if grep -q 'sdk: flutter' "$pkg/pubspec.yaml"; then
              (cd "$pkg" && flutter test)
            else
              (cd "$pkg" && dart test)
            fi
            echo "::endgroup::"
          done

      - name: Publish dry-run
        run: |
          for pkg in packages/*/; do
            echo "::group::dry-run $pkg"
            (cd "$pkg" && flutter pub publish --dry-run)
            echo "::endgroup::"
          done

  # One Android release build per example, side by side. Gradle's downloads
  # are cached (written from main, read by pull requests).
  android:
    name: android (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [skio_usb_serial, skio_uart, skio_uvc_camera]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          add-job-summary: never

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Build example (Android release)
        working-directory: packages/${{ matrix.package }}/example
        run: flutter build apk --release

  # Web and Linux builds of the examples.
  web-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Build serial example (web)
        working-directory: packages/skio_usb_serial/example
        run: flutter build web --release

      - name: Build camera example (web)
        working-directory: packages/skio_uvc_camera/example
        run: flutter build web --release

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build UART example (Linux)
        working-directory: packages/skio_uart/example
        run: flutter build linux --release

  # The check branch protection requires. It passes only when every job
  # above passed, so the jobs can run in parallel without changing the rule.
  ci:
    if: always()
    needs: [checks, android, web-linux]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  # The macOS serial backends are tested against pseudo-terminals, which
  # need a Mac. (The Linux ones run in the checks job above.)
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Test serial (macOS)
        working-directory: packages/skio_usb_serial
        run: flutter test

      - name: Build serial example (macOS)
        working-directory: packages/skio_usb_serial/example
        run: flutter build macos --debug

      - name: Test UART (macOS)
        working-directory: packages/skio_uart
        run: dart test

      - name: Build UART example (macOS)
        working-directory: packages/skio_uart/example
        run: flutter build macos --debug

  # skio_uart's Windows backend: unit tests and a build of the example.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Test UART (Windows)
        working-directory: packages/skio_uart
        run: dart test

      - name: Build UART example (Windows)
        working-directory: packages/skio_uart/example
        run: flutter build windows --debug
