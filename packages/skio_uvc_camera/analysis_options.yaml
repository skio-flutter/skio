include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by tool/jnigen.dart; checked by jnigen, not hand-edited.
    - lib/src/android/bindings.g.dart
    - build/**
    - android/**

linter:
  rules:
    - public_member_api_docs
    - prefer_final_locals
    - unawaited_futures
