name: skio_usb_serial
description: >-
  USB serial for Flutter on Android (USB OTG), macOS, Windows and web (Web
  Serial): talk to ESP32, Arduino, STM32 and CH340, CP210x, FTDI adapters.
  JNI and FFI, no platform channels.
version: 0.3.0-beta.1
homepage: https://skio-flutter.dev
repository: https://github.com/skio-flutter/skio/tree/main/packages/skio_usb_serial
issue_tracker: https://github.com/skio-flutter/skio/issues
topics:
  - usb
  - serial-port
  - esp32
  - web-serial
  - android

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.1.0
  jni: ^1.0.3
  jni_flutter: ^1.0.3
  skio_core: ^0.2.0
  web: ^1.1.1

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      macos:
        dartPluginClass: MacosUsbSerialPlatform
        dartFileName: src/macos/usb_serial_macos.dart
      windows:
        dartPluginClass: WindowsUsbSerialPlatform
        dartFileName: src/windows/usb_serial_windows.dart
      web:
        pluginClass: UsbSerialWeb
        fileName: src/web/usb_serial_web.dart
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jnigen: ^1.0.0
