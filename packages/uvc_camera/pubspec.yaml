name: uvc_camera
description: >-
  USB Video Class (UVC) camera for Flutter on Android (USB OTG) and web:
  live preview, JPEG capture and the camera's hardware button. Part of skio.
version: 0.1.0-dev
repository: https://github.com/skio-flutter/skio/tree/main/packages/uvc_camera
issue_tracker: https://github.com/skio-flutter/skio/issues
topics:
  - camera
  - usb
  - uvc
  - android
  - hardware

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  cross_file: ^0.3.5
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  skio_core: ^0.1.0-beta.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.skio.uvc_camera
        pluginClass: UvcCameraPlugin
      web:
        pluginClass: UvcCameraWeb
        fileName: src/web/uvc_camera_web.dart
